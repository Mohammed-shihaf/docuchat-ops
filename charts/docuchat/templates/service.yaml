apiVersion: v1
kind: Service
metadata:
  name: {{ include "docuchat.fullname" . }}-api
  labels:
    {{- include "docuchat.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "docuchat.apiSelector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
