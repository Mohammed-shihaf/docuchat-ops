{{- if .Values.networkPolicy.enabled }}
# Only the API may talk to Qdrant: nothing else in the cluster can read the vectors.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "docuchat.fullname" . }}-qdrant
  labels:
    {{- include "docuchat.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "docuchat.qdrantSelector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "docuchat.apiSelector" . | nindent 14 }}
      ports:
        - port: 6333
{{- end }}
