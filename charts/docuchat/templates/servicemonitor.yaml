{{- if .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "docuchat.fullname" . }}-api
  labels:
    {{- include "docuchat.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "docuchat.fullname" . }}-alerts
  labels:
    {{- include "docuchat.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: docuchat
      rules:
        - alert: DocuChatHighErrorRate
          expr: |
            sum(rate(docuchat_http_requests_total{status=~"5.."}[5m]))
              / clamp_min(sum(rate(docuchat_http_requests_total[5m])), 0.001) > 0.05
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "More than 5% of DocuChat requests are failing"
        - alert: DocuChatSlowAnswers
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(docuchat_http_request_seconds_bucket{route="/sessions/{session_id}/chat"}[5m]))) > 10
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "p95 chat latency is above 10s"
        - alert: DocuChatLLMErrors
          expr: sum(increase(docuchat_llm_errors_total[10m])) > 5
          labels: { severity: warning }
          annotations:
            summary: "The LLM provider or vector store is failing"
        - alert: DocuChatSessionCleanupStalled
          expr: docuchat_active_sessions > 500
          for: 30m
          labels: { severity: warning }
          annotations:
            summary: "Too many live sessions - check that expiry cleanup is running"
{{- end }}
