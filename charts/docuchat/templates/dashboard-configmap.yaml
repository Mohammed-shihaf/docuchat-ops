{{- if .Values.metrics.grafanaDashboard.enabled }}
# Picked up automatically by the Grafana sidecar in kube-prometheus-stack (label grafana_dashboard=1).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "docuchat.fullname" . }}-dashboard
  labels:
    {{- include "docuchat.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  docuchat.json: |-
    {{- .Files.Get "dashboards/docuchat.json" | nindent 4 }}
{{- end }}
