# -- API ---------------------------------------------------------------------
image:
  repository: ghcr.io/mohammed-shihaf/docuchat-ops
  tag: ""                 # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

# SQLite accounts DB on a ReadWriteOnce volume -> run ONE API replica. Move accounts to Postgres before scaling out.
replicaCount: 1

llm:
  baseUrl: https://api.groq.com/openai/v1
  model: openai/gpt-oss-20b
  # Name of an existing Secret holding key LLM_API_KEY. Create it out-of-band
  # (kubectl / External Secrets / Sealed Secrets) - never put API keys in values files.
  existingSecret: docuchat-llm
  secretKey: LLM_API_KEY

app:
  sessionTtlSeconds: 7200
  maxFileMb: 10
  maxFilesPerSession: 50   # hard ceiling; each plan sets its own lower limit
  rateLimitPerMinute: 30
  trustProxyHeaders: true   # behind the ingress controller
  publicUrl: http://localhost:8080
  cookieSecure: false       # true when served over HTTPS

accounts:
  # Secret with SECRET_KEY, RAZORPAY_KEY_ID/SECRET, RAZORPAY_WEBHOOK_SECRET, SMTP_* (all optional except SECRET_KEY)
  existingSecret: docuchat-accounts
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""

resources:
  requests: { cpu: 250m, memory: 768Mi }
  limits:   { memory: 1536Mi }

autoscaling:
  enabled: false            # see replicaCount note above
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  minAvailable: 0

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: nginx
  host: docuchat.local
  tls: []                   # e.g. [{secretName: docuchat-tls, hosts: [docuchat.example.com]}]
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 11m

# -- Vector store (RAM only: zero retention) -----------------------------------
qdrant:
  image:
    repository: qdrant/qdrant
    tag: v1.20.0
  memoryStorageSize: 1Gi    # tmpfs size; data is lost on restart by design
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { memory: 1536Mi }

# -- Platform -------------------------------------------------------------------
networkPolicy:
  enabled: true

metrics:
  serviceMonitor:
    enabled: false          # set true when the Prometheus Operator CRDs are installed
    interval: 30s
    labels: {}
  grafanaDashboard:
    enabled: false          # set true with kube-prometheus-stack's Grafana dashboard sidecar
