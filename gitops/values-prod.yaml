# Environment values Argo CD applies on top of charts/docuchat/values.yaml.
# CI updates image.tag automatically after a green build on main (see .github/workflows/ci.yml).
image:
  repository: ghcr.io/mohammed-shihaf/docuchat-ops
  tag: "sha-9a33bcd"
  pullPolicy: IfNotPresent

replicaCount: 1  # SQLite accounts DB (see chart values)

ingress:
  enabled: false   # enable with your domain + TLS secret

metrics:
  serviceMonitor:
    enabled: true
  grafanaDashboard:
    enabled: true
