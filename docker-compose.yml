services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    # Zero retention: vectors live in RAM only (tmpfs), so nothing survives a restart or touches disk.
    tmpfs:
      - /qdrant/storage:size=1g
      - /qdrant/snapshots:size=64m
    # No host port: only the API can reach the database.

  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
    depends_on: [qdrant]
    read_only: true          # the container cannot write files anywhere...
    tmpfs: [/tmp]            # ...except a RAM-only /tmp
