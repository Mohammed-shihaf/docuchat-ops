services:
  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]

  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
    depends_on: [qdrant]
    volumes:
      - ./docs:/app/docs:ro
      - model_cache:/app/.cache   # keep the downloaded embedding model between restarts

volumes:
  qdrant_data:
  model_cache:
