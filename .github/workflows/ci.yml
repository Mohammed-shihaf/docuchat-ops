name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["gitops/**", "**.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/docuchat-ops

jobs:
  test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  iac:
    name: Helm & Terraform checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/docuchat
      - run: helm template t charts/docuchat --set ingress.enabled=true --set metrics.serviceMonitor.enabled=true --set metrics.grafanaDashboard.enabled=true > /dev/null
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infra
      - name: terraform validate (local + azure)
        run: |
          for d in infra/local infra/azure; do
            terraform -chdir=$d init -backend=false -input=false >/dev/null
            terraform -chdir=$d validate
          done

  image:
    name: Build, scan & push image
    needs: [test, iac]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy vulnerability scan (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Smoke test the container
        run: |
          docker run -d --name smoke -p 8000:8000 -e WARMUP=false ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          for i in $(seq 1 30); do curl -sf localhost:8000/healthz && break; sleep 2; done
          curl -sf localhost:8000/ | grep -q "DocuChat Ops"
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      # Multi-arch push so the image runs on free ARM VMs (Oracle Always Free Ampere) as well as x86.
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/setup-qemu-action@v3
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  eval:
    name: Answer-quality eval
    needs: image
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for LLM key
        id: key
        run: echo "present=${{ secrets.LLM_API_KEY != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.key.outputs.present == 'true'
        name: Start stack and run evals
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          printf 'LLM_API_KEY=%s\n' "$LLM_API_KEY" > .env
          docker compose up -d --build
          for i in $(seq 1 60); do curl -sf localhost:8000/readyz && break; sleep 3; done
          python3 evals/run_eval.py --min-score 0.8 --report eval-report.json
      - if: steps.key.outputs.present != 'true'
        run: echo "::warning::LLM_API_KEY secret not set - skipping answer-quality eval"
      - if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with: { name: eval-report, path: eval-report.json }

  deploy:
    name: GitOps - bump image tag
    needs: [image, eval]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Point Argo CD at the new image
        run: |
          sed -i "s/^\(\s*tag:\).*/\1 \"${{ needs.image.outputs.tag }}\"/" gitops/values-prod.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: docuchat ${{ needs.image.outputs.tag }}" || echo "no change"
          git push
